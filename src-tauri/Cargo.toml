[package]
name = "rustbox"
version = "0.12.0" # x-release-please-version
description = "A desktop shell that hosts multiple web services in one window"
authors = ["Ismael Figueroa"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "rustbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
open = "5"
png = "0.18"
semver = "1"
serde = { version = "1", features = ["derive"] }
sys-locale = "0.3"
serde_json = "1"
tauri = { version = "2", features = ["unstable", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
auto-launch = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
notify-rust = "4.18"
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[target.'cfg(target_os = "windows")'.dependencies]
tauri-winrt-notification = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDate", "NSSet", "NSString", "NSUUID"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "WKWebsiteDataStore", "WKWebsiteDataRecord"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
