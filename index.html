<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rustbox</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="shell">
      <aside id="sidebar">
        <button id="brand-button" class="brand" type="button" title="rustbox" aria-label="Show the rustbox dashboard">
          <span class="brand-mark">rb</span>
          <span class="brand-name">rustbox</span>
        </button>
        <div id="service-list" role="listbox" aria-label="Services"></div>
        <button
          id="dnd-button"
          class="dnd-button"
          type="button"
          aria-pressed="false"
          title="Pause sounds and notifications for every service."
          aria-label="Pause sounds and notifications for every service."
        >
          <svg class="dnd-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path
              fill="currentColor"
              d="M12 3a1 1 0 0 1 1 1v1.05A6 6 0 0 1 18 11v3.2l1.4 2.1a1 1 0 0 1-.84 1.55H5.44a1 1 0 0 1-.84-1.55L6 14.2V11a6 6 0 0 1 5-5.95V4a1 1 0 0 1 1-1zm0 18a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 21z"
            />
          </svg>
          <span class="dnd-label">Do not disturb</span>
        </button>
        <div class="rail-footer">
          <button
            id="collapse-button"
            class="rail-button collapse"
            type="button"
            title="Collapse sidebar"
            aria-label="Collapse sidebar"
          >
            <span aria-hidden="true">‹</span>
          </button>
          <button
            id="manage-button"
            class="rail-button"
            type="button"
            title="Add a service"
            aria-label="Add a service"
          >
            +
          </button>
        </div>
      </aside>
      <section id="stage">
        <div id="dashboard">
          <header class="dash-head">
            <div>
              <p class="eyebrow">desk</p>
              <h1>rustbox</h1>
              <p class="lede">Every service in this window, with its own session.</p>
            </div>
            <div class="dash-tools">
              <p id="app-version" class="version"></p>
              <button id="dash-add" type="button">Add service</button>
            </div>
          </header>
          <div id="dash-grid" class="dash-grid"></div>
          <p id="dash-empty" class="empty-desk" hidden>No services yet. Add a preset or a custom URL.</p>
        </div>
        <p id="stage-status" hidden></p>
      </section>
    </div>

    <dialog id="manager">
      <div class="manager-card">
        <header class="manager-head">
          <div>
            <p class="eyebrow">services</p>
            <h2>Add a service</h2>
          </div>
          <button id="manager-close" class="text-button" type="button">Close</button>
        </header>
        <p id="manager-error" class="error" hidden></p>

        <section>
          <h3>Presets</h3>
          <div id="preset-list" class="preset-grid"></div>
          <div id="server-url-row" class="server-row" hidden>
            <label id="server-url-label" for="server-url">Server URL</label>
            <input id="server-url" type="text" autocomplete="off" spellcheck="false" />
            <button id="server-url-add" type="button">Add</button>
          </div>
        </section>

        <section>
          <h3>Custom service</h3>
          <div class="custom-grid">
            <label>
              Name
              <input id="custom-name" type="text" maxlength="80" />
            </label>
            <label>
              URL
              <input id="custom-url" type="text" placeholder="https://example.com" spellcheck="false" />
            </label>
            <label>
              Icon URL or emoji
              <input id="custom-icon" type="text" placeholder="optional" />
            </label>
            <label>
              Color
              <input id="custom-color" type="color" value="#8d8478" />
            </label>
            <label class="check">
              <input id="custom-chrome" type="checkbox" checked />
              Use a Chrome user agent
            </label>
            <label class="wide">
              Custom user agent
              <input id="custom-ua" type="text" spellcheck="false" placeholder="Leave blank for the built-in Chrome string" />
            </label>
          </div>
          <button id="custom-add" type="button">Add custom service</button>
        </section>

        <footer class="paths">
          <p id="config-path"></p>
          <p id="sessions-path"></p>
          <p id="ua-hint"></p>
        </footer>
      </div>
    </dialog>

    <div id="service-menu" class="service-menu" role="menu" hidden>
      <p id="service-menu-title"></p>
      <button id="service-menu-sound" type="button" role="menuitemcheckbox" aria-checked="true">Sound on</button>
      <button id="service-menu-notes" type="button" role="menuitemcheckbox" aria-checked="true">Notifications on</button>
      <p id="service-menu-note" class="menu-note" hidden>Do not disturb is on, so every service stays quiet.</p>
      <button id="service-menu-reload" type="button" role="menuitem">Reload</button>
      <button id="service-menu-copy" type="button" role="menuitem">Copy URL</button>
      <button id="service-menu-browser" type="button" role="menuitem">Open in browser</button>
    </div>
  </body>
</html>
