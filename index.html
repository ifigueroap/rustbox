<!doctype html>
<html lang="en" data-theme="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rustbox</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="shell">
      <nav id="workspace-rail" aria-label="Workspaces" hidden>
        <div id="workspace-list" role="listbox" aria-label="Workspaces"></div>
        <button
          id="workspace-add"
          class="ws-add"
          type="button"
          title="New workspace"
          aria-label="New workspace"
        >
          +
        </button>
      </nav>
      <aside id="sidebar">
        <button id="brand-button" class="brand" type="button" title="rustbox" aria-label="Show the rustbox dashboard">
          <span class="brand-mark">rb</span>
          <span class="brand-name">rustbox</span>
        </button>
        <div id="service-list" role="listbox" aria-label="Services"></div>
        <button
          id="dnd-button"
          class="dnd-button"
          type="button"
          aria-pressed="false"
          title="Pause sounds and notifications for every service."
          aria-label="Pause sounds and notifications for every service."
        >
          <svg class="dnd-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path
              fill="currentColor"
              d="M12 3a1 1 0 0 1 1 1v1.05A6 6 0 0 1 18 11v3.2l1.4 2.1a1 1 0 0 1-.84 1.55H5.44a1 1 0 0 1-.84-1.55L6 14.2V11a6 6 0 0 1 5-5.95V4a1 1 0 0 1 1-1zm0 18a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 21z"
            />
            <path class="dnd-off-mark" d="m4 4 16 16" />
          </svg>
          <span class="dnd-label">Do not disturb</span>
        </button>
        <div class="rail-footer">
          <button
            id="collapse-button"
            class="rail-button collapse"
            type="button"
            title="Collapse sidebar"
            aria-label="Collapse sidebar"
          >
            <span aria-hidden="true">‹</span>
          </button>
          <button
            id="manage-button"
            class="rail-button"
            type="button"
            title="Add a service"
            aria-label="Add a service"
          >
            +
          </button>
        </div>
      </aside>
      <section id="stage">
        <div id="dashboard">
          <header class="dash-head">
            <div>
              <p id="dash-eyebrow" class="eyebrow">desk</p>
              <h1 id="dash-title">rustbox</h1>
              <p id="dash-lede" class="lede">Every service in this window, with its own session.</p>
            </div>
            <div class="dash-tools">
              <label class="appearance-control" for="theme-select">
                <span>Appearance</span>
                <select id="theme-select">
                  <option value="auto">Auto</option>
                  <option value="light">Light</option>
                  <option value="dark">Dark</option>
                </select>
              </label>
              <p id="app-version" class="version"></p>
              <label class="close-tray" title="Closing the window hides Rustbox and keeps its services running. Quit from the tray menu, or press Ctrl+Q, to exit.">
                <input id="close-tray" type="checkbox" checked />
                <span>Close to tray</span>
              </label>
              <label class="close-tray" title="Show the workspace rail beside the sidebar.">
                <input id="rail-toggle" type="checkbox" checked />
                <span>Workspace rail</span>
              </label>
              <button id="dash-workspace-add" type="button">New workspace</button>
              <button id="dash-add" type="button">Add service</button>
            </div>
          </header>
          <div class="dash-scope-row">
            <button id="dash-scope" class="text-action" type="button" hidden>All services</button>
          </div>
          <div id="dash-grid" class="dash-grid"></div>
          <p id="dash-empty" class="empty-desk" hidden>No services in this workspace yet. Add one, or switch to All services.</p>
        </div>
        <p id="stage-status" hidden></p>
      </section>
    </div>

    <dialog id="manager">
      <div class="manager-card">
        <header class="manager-head">
          <div>
            <p class="eyebrow">services</p>
            <h2>Add a service</h2>
          </div>
          <button id="manager-close" class="text-button" type="button">Close</button>
        </header>
        <p id="manager-error" class="error" hidden></p>

        <section class="dialog-section">
          <h3>Presets</h3>
          <div id="preset-list" class="preset-grid"></div>
          <div id="server-url-row" class="server-row" hidden>
            <label id="server-url-label" for="server-url">Server URL</label>
            <input id="server-url" type="text" autocomplete="off" spellcheck="false" />
            <button id="server-url-add" type="button">Add</button>
          </div>
        </section>

        <section class="dialog-section">
          <h3>Custom service</h3>
          <div id="custom-fields" class="custom-grid"></div>
          <p id="custom-error" class="error" hidden></p>
          <div class="dialog-footer">
            <button id="custom-add" class="primary" type="button" disabled>Add custom service</button>
          </div>
        </section>

        <footer class="paths">
          <p id="config-path"></p>
          <p id="sessions-path"></p>
          <p id="ua-hint"></p>
        </footer>
      </div>
    </dialog>

    <dialog id="editor">
      <form id="editor-form" class="manager-card" method="dialog">
        <header class="manager-head">
          <div>
            <p class="eyebrow">service</p>
            <h2>Edit service</h2>
          </div>
          <button id="editor-close" class="text-button" type="button">Close</button>
        </header>
        <div class="dialog-body">
          <p id="editor-error" class="error" hidden></p>
          <div id="editor-fields" class="custom-grid"></div>
        </div>
        <div class="dialog-footer">
          <button id="editor-cancel" type="button">Cancel</button>
          <button id="editor-save" class="primary" type="submit" disabled>Save</button>
        </div>
      </form>
    </dialog>

    <dialog id="workspace-editor">
      <form id="workspace-form" class="manager-card" method="dialog">
        <header class="manager-head">
          <div>
            <p class="eyebrow">workspace</p>
            <h2 id="workspace-editor-title">New workspace</h2>
          </div>
          <button id="workspace-close" class="text-button" type="button">Close</button>
        </header>
        <div class="dialog-body">
          <p id="workspace-error" class="error" hidden></p>
          <div class="custom-grid">
            <label class="wide">
              Name
              <input id="workspace-name" type="text" maxlength="80" autocomplete="off" spellcheck="false" />
            </label>
            <label class="wide">
              Icon
              <div class="icon-row">
                <span id="workspace-preview" class="avatar icon-preview"></span>
                <button id="workspace-choose" class="file-button" type="button">Choose image</button>
                <input id="workspace-file" type="file" accept=".png,.svg,.ico,.jpg,.jpeg,.webp,image/png,image/svg+xml,image/jpeg,image/webp,image/x-icon" hidden />
                <input id="workspace-icon" type="text" placeholder="Emoji, URL, or leave blank for the initial" spellcheck="false" />
                <button id="workspace-icon-reset" class="text-action" type="button">Use initial</button>
              </div>
              <p class="field-hint">An emoji like 💼, an image URL, or a file copied into Rustbox's data folder.</p>
            </label>
            <label class="wide">
              Accent color
              <div class="accent-row">
                <input id="workspace-color" type="color" value="#8d8478" aria-label="Workspace accent color" />
                <input id="workspace-hex" type="text" class="hex-input" value="#8d8478" spellcheck="false" aria-label="Workspace accent color hex" />
              </div>
              <p class="field-hint">Used for the rail highlight and the letter fallback.</p>
            </label>
          </div>
        </div>
        <div class="dialog-footer">
          <button id="workspace-cancel" type="button">Cancel</button>
          <button id="workspace-save" class="primary" type="submit" disabled>Save</button>
        </div>
      </form>
    </dialog>

  </body>
</html>
