<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rustbox</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="shell">
      <aside id="sidebar">
        <button id="brand-button" class="brand" type="button" title="rustbox" aria-label="Show the rustbox dashboard">
          <span class="brand-mark">rb</span>
          <span class="brand-name">rustbox</span>
        </button>
        <div id="service-list" role="listbox" aria-label="Services"></div>
        <div class="rail-footer">
          <button
            id="collapse-button"
            class="rail-button collapse"
            type="button"
            title="Collapse sidebar"
            aria-label="Collapse sidebar"
          >
            <span aria-hidden="true">‹</span>
          </button>
          <button
            id="manage-button"
            class="rail-button"
            type="button"
            title="Add a service"
            aria-label="Add a service"
          >
            +
          </button>
        </div>
      </aside>
      <section id="stage">
        <div id="dashboard">
          <header class="dash-head">
            <div>
              <p class="eyebrow">desk</p>
              <h1>rustbox</h1>
              <p class="lede">Every service in this window, with its own session.</p>
            </div>
            <div class="dash-tools">
              <p id="app-version" class="version"></p>
              <button id="dash-add" type="button">Add service</button>
            </div>
          </header>
          <div id="dash-grid" class="dash-grid"></div>
          <p id="dash-empty" class="empty-desk" hidden>No services yet. Add a preset or a custom URL.</p>
        </div>
        <p id="stage-status" hidden></p>
      </section>
    </div>

    <dialog id="manager">
      <div class="manager-card">
        <header class="manager-head">
          <div>
            <p class="eyebrow">services</p>
            <h2>Add a service</h2>
          </div>
          <button id="manager-close" class="text-button" type="button">Close</button>
        </header>
        <p id="manager-error" class="error" hidden></p>

        <section>
          <h3>Presets</h3>
          <div id="preset-list" class="preset-grid"></div>
          <div id="server-url-row" class="server-row" hidden>
            <label id="server-url-label" for="server-url">Server URL</label>
            <input id="server-url" type="text" autocomplete="off" spellcheck="false" />
            <button id="server-url-add" type="button">Add</button>
          </div>
        </section>

        <section>
          <h3>Custom service</h3>
          <div class="custom-grid">
            <label>
              Name
              <input id="custom-name" type="text" maxlength="80" />
            </label>
            <label>
              URL
              <input id="custom-url" type="text" placeholder="https://example.com" spellcheck="false" />
            </label>
            <label>
              Icon URL or emoji
              <input id="custom-icon" type="text" placeholder="optional" />
            </label>
            <label>
              Color
              <input id="custom-color" type="color" value="#8d8478" />
            </label>
            <label class="check">
              <input id="custom-chrome" type="checkbox" checked />
              Use a Chrome user agent
            </label>
            <label class="wide">
              Custom user agent
              <input id="custom-ua" type="text" spellcheck="false" placeholder="Leave blank for the built-in Chrome string" />
            </label>
          </div>
          <button id="custom-add" type="button">Add custom service</button>
        </section>

        <footer class="paths">
          <p id="config-path"></p>
          <p id="sessions-path"></p>
          <p id="ua-hint"></p>
        </footer>
      </div>
    </dialog>
  </body>
</html>
