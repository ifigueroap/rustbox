name: Pull request

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    name: Conventional commit title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false

  versions:
    name: Version files stay in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check app versions and release-please markers
        run: node scripts/check-release-versions.mjs

  pkgbuild:
    name: Arch recipe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Exercises renderPkgbuild and assertPkgbuild, including the shell-level
      # shape the release job writes.
      - name: Render and validate the PKGBUILD
        run: |
          set -euo pipefail
          node scripts/render-arch-pkgbuild.mjs --self-test
          node scripts/render-arch-pkgbuild.mjs \
            --version 0.0.1 \
            --sha256-file README.md \
            --out /tmp/PKGBUILD.rendered
          bash -n /tmp/PKGBUILD.rendered
          grep -qx 'pkgver=0.0.1 # x-release-please-version' /tmp/PKGBUILD.rendered
          grep -qx 'pkgrel=1' /tmp/PKGBUILD.rendered

      - name: The README one-liner matches the release asset
        run: |
          set -euo pipefail
          grep -q '^pkgname=rustbox$' packaging/arch/PKGBUILD
          grep -q 'https://github.com/ifigueroap/rustbox/releases/latest/download/PKGBUILD' README.md
          grep -q 'makepkg -si' README.md
