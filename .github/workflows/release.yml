name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  # Pull requests build macOS only and do not publish. The release job stays
  # off for that event so a PR cannot create or overwrite a GitHub Release.
  pull_request:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  updater-manifest:
    name: Updater manifest
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Generates a sample latest.json and checks its platforms. This publishes
      # nothing, including on a pull request.
      - name: Dry-run latest.json
        run: node scripts/generate-latest-json.mjs --self-test

  build:
    name: Build ${{ matrix.platform }}
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check tag matches the app version
        run: |
          node -e 'const fs=require("fs"); const version=JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json","utf8")).version; if (process.env.GITHUB_REF_TYPE==="tag" && process.env.GITHUB_REF_NAME!=="v"+version) { console.error("Tag "+process.env.GITHUB_REF_NAME+" does not match app version "+version); process.exit(1); }'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            file \
            build-essential \
            libssl-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Test
        working-directory: src-tauri
        run: cargo test --locked

      - name: Prepare updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/prepare-updater-key.sh

      - name: Build Windows portable executable
        if: matrix.platform == 'windows-latest'
        run: npm run tauri build -- --target ${{ matrix.target }} --no-bundle

      - name: Build Windows NSIS installer
        if: matrix.platform == 'windows-latest'
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles nsis

      - name: Build Linux AppImage and binary
        if: matrix.platform == 'ubuntu-22.04'
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles appimage

      - name: Package Windows asset
        if: matrix.platform == 'windows-latest'
        run: |
          set -euo pipefail
          cp "src-tauri/target/${{ matrix.target }}/release/rustbox.exe" rustbox-windows-x64.exe
          INSTALLER=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/nsis" -type f -name '*-setup.exe' -print -quit)
          if [ -z "$INSTALLER" ]; then
            echo "NSIS installer was not produced"
            find "src-tauri/target/${{ matrix.target }}/release/bundle" -type f | head -n 100
            exit 1
          fi
          cp "$INSTALLER" rustbox-windows-x64-setup.exe
          SIG=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/nsis" -type f -name '*-setup.exe.sig' -print -quit)
          if [ -z "$SIG" ]; then
            echo "NSIS updater signature was not produced"
            find "src-tauri/target/${{ matrix.target }}/release/bundle/nsis" -type f | head -n 100
            exit 1
          fi
          cp "$SIG" rustbox-windows-x64-setup.exe.sig

      - name: Package Linux assets
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          BIN="src-tauri/target/${{ matrix.target }}/release/rustbox"
          test -x "$BIN"
          chmod +x "$BIN"
          tar -C "src-tauri/target/${{ matrix.target }}/release" -czf rustbox-linux-x64.tar.gz rustbox
          APPIMAGE=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/appimage" -type f -name '*.AppImage' | head -n 1)
          if [ -z "$APPIMAGE" ]; then
            echo "AppImage was not produced"
            find src-tauri/target -type f | head -n 100
            exit 1
          fi
          cp "$APPIMAGE" rustbox-linux-x64.AppImage
          chmod +x rustbox-linux-x64.AppImage
          SIG=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/appimage" -type f -name '*.AppImage.sig' | head -n 1)
          if [ -z "$SIG" ]; then
            echo "AppImage updater signature was not produced"
            find "src-tauri/target/${{ matrix.target }}/release/bundle/appimage" -type f | head -n 100
            exit 1
          fi
          cp "$SIG" rustbox-linux-x64.AppImage.sig

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'windows-latest'
        with:
          name: rustbox-windows-x64
          path: |
            rustbox-windows-x64.exe
            rustbox-windows-x64-setup.exe
            rustbox-windows-x64-setup.exe.sig
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'ubuntu-22.04'
        with:
          name: rustbox-linux-x64
          path: |
            rustbox-linux-x64.AppImage
            rustbox-linux-x64.AppImage.sig
            rustbox-linux-x64.tar.gz
          if-no-files-found: error

  build-macos:
    name: Build macos-latest
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check tag matches the app version
        run: |
          node -e 'const fs=require("fs"); const version=JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json","utf8")).version; if (process.env.GITHUB_REF_TYPE==="tag" && process.env.GITHUB_REF_NAME!=="v"+version) { console.error("Tag "+process.env.GITHUB_REF_NAME+" does not match app version "+version); process.exit(1); }'

      - name: Install frontend dependencies
        run: npm ci

      - name: Test
        working-directory: src-tauri
        run: cargo test --locked

      - name: Prepare updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/prepare-updater-key.sh

      - name: Build macOS app and disk image
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/release-macos-build.sh

      - name: Package macOS assets
        run: bash scripts/release-macos-package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: rustbox-macos-universal
          path: |
            rustbox-macos-universal.dmg
            rustbox-macos-universal.app.tar.gz
            rustbox-macos-universal.app.tar.gz.sig
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, build-macos]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -e 'const fs=require("fs"); process.stdout.write(JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json","utf8")).version)')
            echo "name=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect existing release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if body=$(gh release view "${{ steps.tag.outputs.name }}" --json body --jq '.body' 2>/dev/null); then
            if [ -n "${body//[$' \t\r\n']/}" ]; then
              echo "has_notes=true" >> "$GITHUB_OUTPUT"
              printf '%s\n' "$body" > release-notes.txt
            else
              echo "has_notes=false" >> "$GITHUB_OUTPUT"
              printf '%s\n' "Rustbox ${{ steps.tag.outputs.name }} builds." > release-notes.txt
            fi
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
            printf '%s\n' "Rustbox ${{ steps.tag.outputs.name }} builds." > release-notes.txt
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List assets
        run: ls -la artifacts

      # latest.json is uploaded only from this job, which needs every platform
      # build. A pull request never reaches here. A missing signature fails the
      # job before anything is published.
      - name: Generate latest.json
        run: |
          set -euo pipefail
          for file in \
            artifacts/rustbox-windows-x64-setup.exe.sig \
            artifacts/rustbox-linux-x64.AppImage.sig \
            artifacts/rustbox-macos-universal.app.tar.gz.sig
          do
            if [ ! -s "$file" ]; then
              echo "refusing to publish latest.json without $file"
              exit 1
            fi
          done
          VERSION=$(node -e 'const fs=require("fs"); process.stdout.write(JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json","utf8")).version)')
          node scripts/generate-latest-json.mjs \
            --version "$VERSION" \
            --notes-file release-notes.txt \
            --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --windows-sig artifacts/rustbox-windows-x64-setup.exe.sig \
            --linux-sig artifacts/rustbox-linux-x64.AppImage.sig \
            --macos-sig artifacts/rustbox-macos-universal.app.tar.gz.sig \
            --repo "${{ github.repository }}" \
            --tag "${{ steps.tag.outputs.name }}" \
            --out artifacts/latest.json
          node scripts/generate-latest-json.mjs --check artifacts/latest.json

      # Release Please writes the changelog into the GitHub Release before this
      # job runs. Leave those notes in place and only upload the build assets.
      - uses: softprops/action-gh-release@v2
        if: steps.notes.outputs.has_notes == 'true'
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Rustbox ${{ steps.tag.outputs.name }}
          draft: false
          prerelease: false
          overwrite_files: true
          files: |
            artifacts/rustbox-windows-x64.exe
            artifacts/rustbox-windows-x64-setup.exe
            artifacts/rustbox-windows-x64-setup.exe.sig
            artifacts/rustbox-linux-x64.AppImage
            artifacts/rustbox-linux-x64.AppImage.sig
            artifacts/rustbox-linux-x64.tar.gz
            artifacts/rustbox-macos-universal.dmg
            artifacts/rustbox-macos-universal.app.tar.gz
            artifacts/rustbox-macos-universal.app.tar.gz.sig
            artifacts/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: softprops/action-gh-release@v2
        if: steps.notes.outputs.has_notes != 'true'
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Rustbox ${{ steps.tag.outputs.name }}
          draft: false
          prerelease: false
          overwrite_files: true
          files: |
            artifacts/rustbox-windows-x64.exe
            artifacts/rustbox-windows-x64-setup.exe
            artifacts/rustbox-windows-x64-setup.exe.sig
            artifacts/rustbox-linux-x64.AppImage
            artifacts/rustbox-linux-x64.AppImage.sig
            artifacts/rustbox-linux-x64.tar.gz
            artifacts/rustbox-macos-universal.dmg
            artifacts/rustbox-macos-universal.app.tar.gz
            artifacts/rustbox-macos-universal.app.tar.gz.sig
            artifacts/latest.json
          body: |
            Rustbox ${{ steps.tag.outputs.name }} builds.

            ### Windows
            - `rustbox-windows-x64-setup.exe` — install Rustbox for the current user.
            - `rustbox-windows-x64.exe` — portable build.

            Both need the WebView2 runtime, which is already present on Windows 11 and current Windows 10.

            ### Linux
            - `rustbox-linux-x64.AppImage` — `chmod +x rustbox-linux-x64.AppImage` and run it.
            - `rustbox-linux-x64.tar.gz` — contains the `rustbox` binary.

            Both Linux artifacts need WebKitGTK 4.1 installed (`libwebkit2gtk-4.1-0`). The AppImage does not vendor WebKit.

            ### macOS
            - `rustbox-macos-universal.dmg` — open the disk image and drag Rustbox to Applications. One build covers Apple Silicon and Intel.
            - `rustbox-macos-universal.app.tar.gz` — contains `Rustbox.app`.

            macOS 14 or newer is required. When Apple signing secrets are not configured, the build is ad-hoc signed and Gatekeeper quarantines it. Right-click Rustbox, choose Open, and confirm, or run `xattr -dr com.apple.quarantine /Applications/Rustbox.app`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
