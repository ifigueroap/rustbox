name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  # Pull requests build macOS only and do not publish. The release job stays
  # off for that event so a PR cannot create or overwrite a GitHub Release.
  pull_request:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    if: github.event_name != 'pull_request' || matrix.platform == 'macos-latest'
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
          - platform: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check tag matches the app version
        run: |
          node -e 'const fs=require("fs"); const version=JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json","utf8")).version; if (process.env.GITHUB_REF_TYPE==="tag" && process.env.GITHUB_REF_NAME!=="v"+version) { console.error("Tag "+process.env.GITHUB_REF_NAME+" does not match app version "+version); process.exit(1); }'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            file \
            build-essential \
            libssl-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Test
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build Windows portable executable
        if: matrix.platform == 'windows-latest'
        run: npm run tauri build -- --target ${{ matrix.target }} --no-bundle

      - name: Build Windows NSIS installer
        if: matrix.platform == 'windows-latest'
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles nsis

      - name: Build Linux AppImage and binary
        if: matrix.platform == 'ubuntu-22.04'
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles appimage

      - name: Build macOS app and disk image
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          sign=1
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "Apple secret $name is not set; building with an ad-hoc signature"
              sign=0
              break
            fi
          done
          P12=""
          KEYCHAIN=""
          cleanup() {
            if [ -n "$KEYCHAIN" ]; then
              security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true
            fi
            if [ -n "$P12" ]; then
              rm -f "$P12"
            fi
          }
          trap cleanup EXIT
          if [ "$sign" -eq 0 ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            export APPLE_SIGNING_IDENTITY="-"
          else
            echo "Apple signing secrets are present; importing the certificate into a temporary keychain"
            P12="$RUNNER_TEMP/rustbox-certificate.p12"
            KEYCHAIN="$RUNNER_TEMP/rustbox-signing.keychain-db"
            KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
            export RUSTBOX_P12="$P12"
            python3 -c 'import base64, os, pathlib; pathlib.Path(os.environ["RUSTBOX_P12"]).write_bytes(base64.b64decode(os.environ["APPLE_CERTIFICATE"].strip()))'
            unset RUSTBOX_P12
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security default-keychain -s "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -t 3600 -u "$KEYCHAIN"
            existing=$(security list-keychains -d user | sed 's/^[[:space:]]*//;s/"//g')
            # shellcheck disable=SC2086
            security list-keychains -d user -s "$KEYCHAIN" $existing
            security import "$P12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/productbuild
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
            rm -f "$P12"
            P12=""
            echo "Certificate imported"
          fi
          npm run tauri build -- --target ${{ matrix.target }} --bundles dmg,app

      - name: Package Windows asset
        if: matrix.platform == 'windows-latest'
        run: |
          set -euo pipefail
          cp "src-tauri/target/${{ matrix.target }}/release/rustbox.exe" rustbox-windows-x64.exe
          INSTALLER=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/nsis" -type f -name '*-setup.exe' -print -quit)
          if [ -z "$INSTALLER" ]; then
            echo "NSIS installer was not produced"
            find "src-tauri/target/${{ matrix.target }}/release/bundle" -type f | head -n 100
            exit 1
          fi
          cp "$INSTALLER" rustbox-windows-x64-setup.exe

      - name: Package Linux assets
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          BIN="src-tauri/target/${{ matrix.target }}/release/rustbox"
          test -x "$BIN"
          chmod +x "$BIN"
          tar -C "src-tauri/target/${{ matrix.target }}/release" -czf rustbox-linux-x64.tar.gz rustbox
          APPIMAGE=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/appimage" -type f -name '*.AppImage' | head -n 1)
          if [ -z "$APPIMAGE" ]; then
            echo "AppImage was not produced"
            find src-tauri/target -type f | head -n 100
            exit 1
          fi
          cp "$APPIMAGE" rustbox-linux-x64.AppImage
          chmod +x rustbox-linux-x64.AppImage

      - name: Package macOS assets
        if: matrix.platform == 'macos-latest'
        run: |
          set -euo pipefail
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          DMG=$(find "$BUNDLE/dmg" -type f -name '*.dmg' | head -n 1)
          if [ -z "$DMG" ]; then
            echo "DMG was not produced"
            find "$BUNDLE" -type f | head -n 100
            exit 1
          fi
          cp "$DMG" rustbox-macos-universal.dmg
          APP=$(find "$BUNDLE/macos" -maxdepth 1 -type d -name '*.app' | head -n 1)
          if [ -z "$APP" ]; then
            echo ".app bundle was not produced"
            find "$BUNDLE" | head -n 100
            exit 1
          fi
          COPYFILE_DISABLE=1 tar -C "$BUNDLE/macos" -czf rustbox-macos-universal.app.tar.gz "$(basename "$APP")"

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'windows-latest'
        with:
          name: rustbox-windows-x64
          path: |
            rustbox-windows-x64.exe
            rustbox-windows-x64-setup.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'ubuntu-22.04'
        with:
          name: rustbox-linux-x64
          path: |
            rustbox-linux-x64.AppImage
            rustbox-linux-x64.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'macos-latest'
        with:
          name: rustbox-macos-universal
          path: |
            rustbox-macos-universal.dmg
            rustbox-macos-universal.app.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -e 'const fs=require("fs"); process.stdout.write(JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json","utf8")).version)')
            echo "name=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect existing release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if body=$(gh release view "${{ steps.tag.outputs.name }}" --json body --jq '.body' 2>/dev/null); then
            if [ -n "${body//[$' \t\r\n']/}" ]; then
              echo "has_notes=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_notes=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List assets
        run: ls -la artifacts

      # Release Please writes the changelog into the GitHub Release before this
      # job runs. Leave those notes in place and only upload the build assets.
      - uses: softprops/action-gh-release@v2
        if: steps.notes.outputs.has_notes == 'true'
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Rustbox ${{ steps.tag.outputs.name }}
          draft: false
          prerelease: false
          overwrite_files: true
          files: |
            artifacts/rustbox-windows-x64.exe
            artifacts/rustbox-windows-x64-setup.exe
            artifacts/rustbox-linux-x64.AppImage
            artifacts/rustbox-linux-x64.tar.gz
            artifacts/rustbox-macos-universal.dmg
            artifacts/rustbox-macos-universal.app.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: softprops/action-gh-release@v2
        if: steps.notes.outputs.has_notes != 'true'
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Rustbox ${{ steps.tag.outputs.name }}
          draft: false
          prerelease: false
          overwrite_files: true
          files: |
            artifacts/rustbox-windows-x64.exe
            artifacts/rustbox-windows-x64-setup.exe
            artifacts/rustbox-linux-x64.AppImage
            artifacts/rustbox-linux-x64.tar.gz
            artifacts/rustbox-macos-universal.dmg
            artifacts/rustbox-macos-universal.app.tar.gz
          body: |
            Rustbox ${{ steps.tag.outputs.name }} builds.

            ### Windows
            - `rustbox-windows-x64-setup.exe` — install Rustbox for the current user.
            - `rustbox-windows-x64.exe` — portable build.

            Both need the WebView2 runtime, which is already present on Windows 11 and current Windows 10.

            ### Linux
            - `rustbox-linux-x64.AppImage` — `chmod +x rustbox-linux-x64.AppImage` and run it.
            - `rustbox-linux-x64.tar.gz` — contains the `rustbox` binary.

            Both Linux artifacts need WebKitGTK 4.1 installed (`libwebkit2gtk-4.1-0`). The AppImage does not vendor WebKit.

            ### macOS
            - `rustbox-macos-universal.dmg` — open the disk image and drag Rustbox to Applications. One build covers Apple Silicon and Intel.
            - `rustbox-macos-universal.app.tar.gz` — contains `Rustbox.app`.

            macOS 14 or newer is required. When Apple signing secrets are not configured, the build is ad-hoc signed and Gatekeeper quarantines it. Right-click Rustbox, choose Open, and confirm, or run `xattr -dr com.apple.quarantine /Applications/Rustbox.app`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
